{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Criar conta</h1>
  {% include "_erros.html" %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" autocomplete="name" required minlength="3" maxlength="100" value="{{ dados.get('nome', '') }}">
    <label for="login">Login</label>
    <input id="login" name="login" autocomplete="username" required minlength="3" maxlength="30" aria-describedby="dica-login" value="{{ dados.get('login', '') }}">
    <p class="dica" id="dica-login">De 3 a 30 caracteres: letras minúsculas, números, ponto, hífen ou sublinhado.</p>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="8" aria-describedby="dica-senha">
    <p class="dica" id="dica-senha">Mínimo de 8 caracteres, com letras e números.</p>
    <label for="confirmar_senha">Confirme a senha</label>
    <input id="confirmar_senha" name="confirmar_senha" type="password" autocomplete="new-password" required minlength="8">
    <div class="acoes">
      <button type="submit" class="botao">Criar conta</button>
      <a href="{{ url_for('auth.login') }}">Já tenho conta</a>
    </div>
  </form>
</section>
{% endblock %}
