{% extends "base.html" %}
{% block conteudo %}
<form method="get"><input name="mes" placeholder="aaaa-mm" value="{{ mes }}"> <button class="btn">Ver</button></form>
<table>
{% for r in resultado %}
<tr><td>{{ r.sala }}</td><td>{{ r.total }}</td><td>{{ r.horas }}</td><td>{{ r.ocupacao }}%</td><td>{{ r.nivel }}</td></tr>
{% endfor %}
</table>
{% endblock %}
